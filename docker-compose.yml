# docker-compose.yml
# Hệ thống Quản lý Kho hàng Phân tán Đa Chi nhánh (SmartLog WMS PRO)
# Kiến trúc 3 Node Độc lập + 3 Instance SQL Server Riêng biệt + RabbitMQ Topic Exchange

services:
  # ============================================================================
  # 1. THREE PHYSICAL SQL SERVER INSTANCES (PORTS 1433 / 1434 / 1435)
  # NGUYÊN TẮC 1: Mỗi node sở hữu 1 CSDL vật lý riêng biệt, CẤM cross-DB query
  # ============================================================================
  sqlserver_hq:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_hq
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    volumes:
      - ./backend/sql/init_hq.sql:/init_hq.sql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver_hn:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_hn
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1434:1433"
    volumes:
      - ./backend/sql/init_branch_template.sql:/init_branch_template.sql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver_hcm:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_hcm
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1435:1433"
    volumes:
      - ./backend/sql/init_branch_template.sql:/init_branch_template.sql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. MESSAGE BROKER - RABBITMQ (TOPIC EXCHANGE: distributed_warehouse)
  # NGUYÊN TẮC 2: Giao tiếp service-to-service CHỈ qua RabbitMQ
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq_wms
    ports:
      - "5672:5672"     # AMQP Broker
      - "15672:15672"   # Management Web Dashboard
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. THREE DISTRIBUTED APPLICATION NODES
  # ============================================================================
  hq_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.hq
    container_name: hq_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./db_hq.db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  branch_hn:
    build:
      context: ./backend
      dockerfile: Dockerfile.branch
    container_name: branch_hn
    ports:
      - "8001:8001"
    environment:
      - BRANCH_CODE=HN
      - BRANCH_NAME=Chi nhánh Hà Nội
      - PORT=8001
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./db_branch_hn.db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  branch_hcm:
    build:
      context: ./backend
      dockerfile: Dockerfile.branch
    container_name: branch_hcm
    ports:
      - "8002:8002"
    environment:
      - BRANCH_CODE=HCM
      - BRANCH_NAME=Chi nhánh TP.HCM
      - PORT=8002
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./db_branch_hcm.db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_wms
    ports:
      - "3000:3000"
    depends_on:
      - hq_service
      - branch_hn
      - branch_hcm
    restart: on-failure
